<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Devine la ville</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f7a6c7;
      color: white;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 20px;
    }
    #secretLink {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    #message {
      margin-top: 30px;
      font-size: 18px;
      font-style: italic;
    }
    #musicBtn {
      background-color: white;
      color: #f7a6c7;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Pour trouver le mot clé tu devras trouver la ville qui a tout changé :)</h2>

  <input type="text" id="userInput" placeholder="Entre ta réponse ici">
  <button onclick="checkAnswer()">Valider</button>

  <div id="secretLink">
    <p>Bravo Princesse mais c’est que le début, la suite est ici :</p>
    <a href="https://photos.app.goo.gl/Eikv2QMBX73Z7DzbA" target="_blank">Clique ici pour continuer</a>
  </div>

  <div id="message">
    <p>Pour continuer cette aventure, tu devras trouver la ville qui entre nous a tous changé.</p>
    <p>- signé ton admirateur secret -</p>
  </div>

  <button id="musicBtn" onclick="document.getElementById('bgMusic').play()">Pour te faire chanter pendant que tu cherches la réponse princesse</button>

  <audio id="bgMusic" loop>
    <source src="https://audio.jukehost.co.uk/VmAYur2uDQCWRVGrfwaVgwvBTXfM14xq">
    Ton navigateur ne prend pas en charge la lecture audio.
  </audio>

  <script>
    function checkAnswer() {
      const input = document.getElementById("userInput").value.trim().toLowerCase();
      const bonnesVilles = ["marseille", "marseilles"];
      if (bonnesVilles.includes(input)) {
        document.getElementById("secretLink").style.display = "block";
      } else {
        alert("Mais non, repense aux vacances où j'étais déchaîné");
      }
    }
  </script>

</body>
</html>
